<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat App Database (Persistent)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <style>
        body { font-family: Arial; margin: 20px; }
        button { margin: 5px; padding: 8px 15px; }
        table { border-collapse: collapse; margin-top: 15px; width: 100%; }
        th, td { border: 1px solid #999; padding: 6px; text-align: center; }
        th { background: #f0f0f0; }
    </style>
</head>
<body>

<h2>💬 Chat App Database (SQL in Browser)</h2>

<button onclick="loadUsers()">Load Users</button>
<button onclick="loadMessages()">Load Messages</button>
<button onclick="loadGroups()">Load Groups</button>

<div id="table"></div>

<script>
    let db;
    let SQL;
    const DB_KEY = "chat_app_db";

    initSqlJs({
        locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
    }).then(sqlLib => {
        SQL = sqlLib;
        loadDatabase();
    });

    function loadDatabase() {
        const saved = localStorage.getItem(DB_KEY);

        if (saved) {
            const bytes = Uint8Array.from(atob(saved), c => c.charCodeAt(0));
            db = new SQL.Database(bytes);
        } else {
            db = new SQL.Database();
            initDB();
            saveDB();
        }
    }

    function saveDB() {
        const data = db.export();
        localStorage.setItem(DB_KEY, btoa(String.fromCharCode(...data)));
    }

    function initDB() {
        db.run(`
    CREATE TABLE users (
        user_id INTEGER PRIMARY KEY AUTOINCREMENT,
        username TEXT,
        email TEXT,
        password TEXT,
        status TEXT
    );

    CREATE TABLE groups (
        group_id INTEGER PRIMARY KEY AUTOINCREMENT,
        group_name TEXT,
        created_by INTEGER
    );

    CREATE TABLE messages (
        message_id INTEGER PRIMARY KEY AUTOINCREMENT,
        sender_id INTEGER,
        receiver_id INTEGER,
        group_id INTEGER,
        content TEXT
    );

    INSERT INTO users VALUES
    (1,'ahmad','ahmad@mail.com','123','online'),
    (2,'mohammed','moh@mail.com','123','offline'),
    (3,'ali','ali@mail.com','123','away'),
    (4,'sara','sara@mail.com','123','online'),
    (5,'lina','lina@mail.com','123','offline'),
    (6,'omar','omar@mail.com','123','online'),
    (7,'yousef','yousef@mail.com','123','offline'),
    (8,'noor','noor@mail.com','123','away'),
    (9,'khaled','khaled@mail.com','123','online'),
    (10,'reem','reem@mail.com','123','offline');

    INSERT INTO groups VALUES
    (1,'Family',1),(2,'Friends',2),(3,'Work',3),
    (4,'University',4),(5,'Flutter Devs',5),
    (6,'Gaming',6),(7,'Designers',7),
    (8,'Music Lovers',8),(9,'Sports',9),(10,'Tech News',10);

    INSERT INTO messages VALUES
    (1,1,2,NULL,'Hello Mohammed'),
    (2,2,1,NULL,'Hi Ahmad'),
    (3,5,NULL,1,'Hello family'),
    (4,6,NULL,2,'Friends meeting');
    `);
    }

    function renderTable(result) {
        let html = "<table><tr>";
        result.columns.forEach(c => html += `<th>${c}</th>`);
        html += "</tr>";

        result.values.forEach(row => {
            html += "<tr>";
            row.forEach(v => html += `<td>${v}</td>`);
            html += "</tr>";
        });

        html += "</table>";
        document.getElementById("table").innerHTML = html;
    }

    function loadUsers() {
        const res = db.exec("SELECT * FROM users")[0];
        renderTable(res);
    }

    function loadMessages() {
        const res = db.exec("SELECT * FROM messages")[0];
        renderTable(res);
    }

    function loadGroups() {
        const res = db.exec("SELECT * FROM groups")[0];
        renderTable(res);
    }
</script>

</body>
</html>
